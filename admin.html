<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel Admin — Tem de Tudo</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#f4f7fb;--card:#fff;--text:#142033;--muted:#64748b;--line:#e2e8f0;--blue:#0284c7;--dark:#07111f;--green:#16a34a;--red:#dc2626}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}header{background:var(--dark);color:#fff;padding:22px 5%;display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}header h1{margin:0;font-size:22px}header p{margin:5px 0 0;color:#bfdbfe;font-size:13px}.wrap{max-width:1180px;margin:28px auto;padding:0 20px}.screen{display:none}.screen.active{display:block}.card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:22px;box-shadow:0 8px 25px #0f172a12}.login{max-width:420px;margin:70px auto}.form{display:grid;gap:13px}.form label{display:grid;gap:6px;font-size:13px;font-weight:bold}.form input,.form textarea,.form select{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font:inherit}.form textarea{min-height:88px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.toolbar,.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:8px;padding:12px 16px;cursor:pointer;font-weight:bold}.primary{background:var(--blue);color:#fff}.green{background:var(--green);color:#fff}.light{background:var(--card);color:var(--text);border:1px solid var(--line)}.red{background:#fee2e2;color:var(--red)}.notice{display:none;padding:13px;border-radius:9px;margin-bottom:18px;background:#dcfce7;color:#166534}.notice.show{display:block}.error{background:#fee2e2;color:#991b1b}.editor{display:none;margin:20px 0}.editor.show{display:block}.products{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:20px}.product-card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}.product-card img{width:100%;height:170px;object-fit:cover;background:#e2e8f0}.body{padding:14px}.body h3{margin:0 0 7px}.meta{font-size:12px;color:var(--muted);line-height:1.5}.price{font-size:19px;font-weight:bold;margin:10px 0}.file-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.file-box{border:1px dashed #94a3b8;border-radius:9px;padding:12px}.file-box img{width:100%;height:100px;object-fit:cover;border-radius:6px;margin-top:8px;display:none}.file-box img.show{display:block}.small{font-size:12px;color:var(--muted);font-weight:normal}@media(max-width:800px){.products{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.products{grid-template-columns:1fr}.row,.file-grid{grid-template-columns:1fr}header{padding:18px 20px}}</style></head><body><header><div><h1>⚙ Painel administrativo</h1><p>Tem de Tudo Eletrônicos • Supabase</p></div><div class="actions"><button class="btn light" onclick="openStore()">Abrir loja</button><button id="logoutBtn" class="btn light" style="display:none" onclick="logout()">Sair</button></div></header><main class="wrap"><div id="notice" class="notice"></div><section id="loginScreen" class="screen active card login"><h2>Entrar no painel</h2><p class="small">Acesso protegido pelo Supabase Auth.</p><form class="form" onsubmit="login(event)"><label>E-mail<input id="loginEmail" type="email" required value="fernando2018a1986@gmail.com"></label><label>Senha<input id="loginPassword" type="password" required></label><button class="btn primary" type="submit">Entrar</button></form></section><section id="appScreen" class="screen"><div class="toolbar"><button class="btn primary" onclick="newProduct()">+ Novo produto</button><button class="btn light" onclick="loadProducts()">Atualizar catálogo</button></div><section id="editor" class="editor card"><h2 id="editorTitle">Novo produto</h2><form class="form" onsubmit="saveProduct(event)"><input id="productId" type="hidden"><label>Nome do produto<input id="name" required></label><div class="row"><label>Categoria<select id="category"><option value="electronics">Eletrônicos</option><option value="home">Casa inteligente</option><option value="accessories">Acessórios</option><option value="innovation">Inovações</option></select></label><label>Tipo exibido<input id="type" required value="Eletrônicos"></label></div><div class="row"><label>Preço<input id="price" required type="number" min="0" step="0.01"></label><label>Estoque<input id="stock" required type="number" min="0" value="0"></label></div><label>Descrição<textarea id="description" required></textarea></label><div class="file-grid"><label class="file-box">Imagem 1 <span class="small">(obrigatória)</span><input id="file1" type="file" accept="image/*" required><img id="preview1"></label><label class="file-box">Imagem 2 <span class="small">(opcional)</span><input id="file2" type="file" accept="image/*"><img id="preview2"></label><label class="file-box">Imagem 3 <span class="small">(opcional)</span><input id="file3" type="file" accept="image/*"><img id="preview3"></label></div><div class="actions"><button class="btn green" type="submit">Salvar produto</button><button class="btn light" type="button" onclick="closeEditor()">Cancelar</button></div></form></section><section id="products" class="products"></section></section></main><script>const SUPABASE_URL='https://pujofmvhvupzkavvundq.supabase.co';const SUPABASE_KEY='sb_publishable_phtv0IDkLQkrDl2Yo-hLmw_PAQ2Y0dd';const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let products=[];function notice(msg,error=false){let n=document.getElementById('notice');n.textContent=msg;n.className='notice show'+(error?' error':'');setTimeout(()=>n.className='notice',3500)}function openStore(){window.open('15-tem-de-tudo-eletronicos.html','_blank')}async function login(e){e.preventDefault();let {error}=await client.auth.signInWithPassword({email:document.getElementById('loginEmail').value,password:document.getElementById('loginPassword').value});if(error)return notice(error.message.includes('Email not confirmed')?'Confirme o e-mail recebido antes de entrar.':error.message,true);showApp();loadProducts()}async function showApp(){document.getElementById('loginScreen').classList.remove('active');document.getElementById('appScreen').classList.add('active');document.getElementById('logoutBtn').style.display='block'}async function logout(){await client.auth.signOut();location.reload()}async function loadProducts(){let result=await client.from('products').select('id,name,category,product_type,description,price,stock,published,product_images(image_url,position)').order('created_at',{ascending:true});if(result.error)return notice(result.error.message,true);products=result.data||[];render()}function money(v){return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}function render(){document.getElementById('products').innerHTML=products.map(p=>{let img=(p.product_images||[]).sort((a,b)=>a.position-b.position)[0]?.image_url||'https://placehold.co/900x600/0f172a/ffffff?text=Produto';return '<article class="product-card"><img src="'+img+'" alt="'+p.name.replace(/"/g,'&quot;')+'"><div class="body"><h3>'+p.name+'</h3><div class="meta">'+p.product_type+' • estoque: '+p.stock+'<br>'+p.description+'</div><div class="price">'+money(p.price)+'</div><div class="actions"><button class="btn primary" onclick="editProduct(\''+p.id+'\')">Editar</button><button class="btn red" onclick="deleteProduct(\''+p.id+'\')">Excluir</button></div></div></article>'}).join('')}function clearForm(){document.querySelector('#editor form').reset();document.getElementById('productId').value='';[1,2,3].forEach(i=>{document.getElementById('preview'+i).src='';document.getElementById('preview'+i).classList.remove('show');document.getElementById('file'+i).required=i===1})}function newProduct(){clearForm();document.getElementById('editorTitle').textContent='Novo produto';document.getElementById('editor').classList.add('show');scrollTo({top:0,behavior:'smooth'})}function editProduct(id){let p=products.find(x=>x.id===id);if(!p)return;clearForm();document.getElementById('editorTitle').textContent='Editar produto';document.getElementById('productId').value=p.id;document.getElementById('name').value=p.name;document.getElementById('category').value=p.category;document.getElementById('type').value=p.product_type;document.getElementById('price').value=p.price;document.getElementById('stock').value=p.stock;document.getElementById('description').value=p.description;document.getElementById('file1').required=false;(p.product_images||[]).sort((a,b)=>a.position-b.position).forEach((im,i)=>{if(i<3){document.getElementById('preview'+(i+1)).src=im.image_url;document.getElementById('preview'+(i+1)).classList.add('show')}});document.getElementById('editor').classList.add('show');scrollTo({top:0,behavior:'smooth'})}function closeEditor(){document.getElementById('editor').classList.remove('show')}[1,2,3].forEach(i=>document.getElementById('file'+i).addEventListener('change',e=>{let file=e.target.files[0],img=document.getElementById('preview'+i);if(file){img.src=URL.createObjectURL(file);img.classList.add('show')}}));async function uploadImages(productId){let urls=[];for(let i=1;i<=3;i++){let file=document.getElementById('file'+i).files[0];if(!file)continue;let safe=file.name.toLowerCase().replace(/[^a-z0-9.]+/g,'-'),path=productId+'/'+Date.now()+'-'+i+'-'+safe,result=await client.storage.from('product-images').upload(path,file,{upsert:true,contentType:file.type});if(result.error)throw result.error;let publicUrl=client.storage.from('product-images').getPublicUrl(path).data.publicUrl;urls.push({image_url:publicUrl,position:i})}return urls}async function saveProduct(e){e.preventDefault();let id=document.getElementById('productId').value||crypto.randomUUID(),payload={id,name:document.getElementById('name').value.trim(),category:document.getElementById('category').value,product_type:document.getElementById('type').value.trim(),description:document.getElementById('description').value.trim(),price:Number(document.getElementById('price').value),stock:Number(document.getElementById('stock').value),published:true};let result=await client.from('products').upsert(payload);if(result.error)return notice(result.error.message,true);try{let urls=await uploadImages(id);if(urls.length){await client.from('product_images').delete().eq('product_id',id).in('position',urls.map(x=>x.position));let inserted=await client.from('product_images').insert(urls.map(x=>({...x,product_id:id})));if(inserted.error)throw inserted.error}}catch(error){return notice('Produto salvo, mas houve erro no upload: '+error.message,true)}closeEditor();notice('Produto salvo no Supabase.');loadProducts()}async function deleteProduct(id){if(!confirm('Excluir este produto e suas imagens?'))return;let result=await client.from('products').delete().eq('id',id);if(result.error)return notice(result.error.message,true);notice('Produto excluído.');loadProducts()}client.auth.getSession().then(({data})=>{if(data.session){showApp();loadProducts()}});</script></body></html>
